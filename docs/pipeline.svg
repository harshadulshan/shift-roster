<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="262" viewBox="0 0 1000 262" role="img" aria-label="How a roster is made: team and rules, a first roster person by person, then large neighbourhood search: free one part of the roster, re-roster it exactly with CP-SAT, keep it if no worse; every roster passes an independent check before the calendar, Excel roster and sick-call repairs." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>How a roster is made</title>
<style>text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x="0.5" y="0.5" width="999" height="261" rx="14" fill="#0d1117" stroke="#30363d"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#8b949e"/></marker></defs><rect width="0" height="0"><animate id="t" attributeName="width" from="0" to="0" dur="10.0s" begin="0s;t.end"/></rect>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0200;0.0550;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><rect x="24" y="70" width="150" height="62" rx="10" fill="#161b22" stroke="#58a6ff" stroke-opacity=".75"/><text x="36" y="92" font-size="14" font-weight="700" fill="#e6edf3">Team + rules</text><text x="36" y="109" font-size="11.5" fill="#8b949e">contracts, cover,</text><text x="36" y="123" font-size="11.5" fill="#8b949e">leave, requests</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0900;0.1250;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><rect x="196" y="70" width="160" height="62" rx="10" fill="#161b22" stroke="#58a6ff" stroke-opacity=".75"/><text x="208" y="92" font-size="14" font-weight="700" fill="#e6edf3">First roster</text><text x="208" y="109" font-size="11.5" fill="#8b949e">each person alone:</text><text x="208" y="123" font-size="11.5" fill="#8b949e">a valid pattern</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1700;0.2050;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><rect x="392" y="40" width="164" height="62" rx="10" fill="#161b22" stroke="#f0883e" stroke-opacity=".75"/><text x="404" y="62" font-size="14" font-weight="700" fill="#e6edf3">Free one part</text><text x="404" y="79" font-size="11.5" fill="#8b949e">a few people, a few</text><text x="404" y="93" font-size="11.5" fill="#8b949e">days, or a short shift</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2400;0.2750;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><rect x="580" y="40" width="164" height="62" rx="10" fill="#161b22" stroke="#f0883e" stroke-opacity=".75"/><text x="592" y="62" font-size="14" font-weight="700" fill="#e6edf3">Re-roster it</text><text x="592" y="79" font-size="11.5" fill="#8b949e">exactly, with CP-SAT</text><text x="592" y="93" font-size="11.5" fill="#8b949e">(everyone else fixed)</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3100;0.3450;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><rect x="486" y="150" width="150" height="62" rx="10" fill="#161b22" stroke="#f0883e" stroke-opacity=".75"/><text x="498" y="172" font-size="14" font-weight="700" fill="#e6edf3">Keep it?</text><text x="498" y="189" font-size="11.5" fill="#8b949e">if no worse;</text><text x="498" y="203" font-size="11.5" fill="#8b949e">adapt the size</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6600;0.6950;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><rect x="770" y="70" width="206" height="62" rx="10" fill="#161b22" stroke="#3fb950" stroke-opacity=".75"/><text x="782" y="92" font-size="14" font-weight="700" fill="#e6edf3">Independent check</text><text x="782" y="109" font-size="11.5" fill="#8b949e">every rule, every person;</text><text x="782" y="123" font-size="11.5" fill="#8b949e">penalties recomputed</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0700;0.1000;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><path d="M174 101 L192 101" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah)"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1500;0.1800;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><path d="M356 101 C374 101 376 71 388 71" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah)"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2200;0.2500;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><path d="M556 71 L576 71" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah)"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2900;0.3200;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><path d="M662 102 C662 132 650 152 638 160" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah)"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3400;0.3700;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><path d="M486 181 C446 181 438 122 450 106" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah)"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6400;0.6700;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><path d="M744 71 C760 71 756 101 766 101" fill="none" stroke="#3fb950" stroke-width="1.6" marker-end="url(#ah)"/></g>
<path id="loop" d="M474 71 L662 71 L662 150 L561 181 L462 150 Z" fill="none" stroke="none"/>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3600;0.3800;0.6400;0.6401;1" dur="10.0s" begin="t.begin" fill="freeze"/><circle r="5" fill="#f0883e"><animateMotion dur="0.8s" repeatCount="indefinite"><mpath href="#loop"/></animateMotion></circle></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3900;0.4200;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><text x="672" y="204" font-size="12.5" font-weight="700" fill="#f0883e">large neighbourhood search</text><text x="672" y="221" font-size="11.5" fill="#8b949e">small teams: the whole problem at once,</text><text x="672" y="236" font-size="11.5" fill="#8b949e">often proven optimal</text></g>
<text x="24" y="34" font-size="13" font-weight="700" fill="#e6edf3">How a roster is made</text><text x="24" y="226" font-size="11.5" fill="#8b949e">Every hard rule belongs to one person; people are</text><text x="24" y="241" font-size="11.5" fill="#8b949e">linked only by cover, so parts can be re-rostered exactly.</text>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7000;0.7300;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><text x="873" y="160" text-anchor="middle" font-size="12" fill="#e6edf3">calendar · fairness</text><text x="873" y="176" text-anchor="middle" font-size="12" fill="#e6edf3">Excel roster · sick calls</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6900;0.7200;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><path d="M873 132 L873 146" fill="none" stroke="#3fb950" stroke-width="1.6" marker-end="url(#ah)"/></g>
</svg>
